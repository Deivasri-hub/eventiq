services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - eventiq_db:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eventiq
      JWT_SECRET: eventiq-demo-secret-change-me
      PORT: 4000
    depends_on:
      - db
    ports:
      - "4000:4000"
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"
volumes:
  eventiq_db:
